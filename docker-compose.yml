services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"

    healthcheck:
      test: 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
